name: Fix Compose lint modernization

on:
  push:
    branches:
      - feature/oneui8-compose-components

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch Compose lint violations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          date_picker = Path('lib/src/main/java/org/oneui/compose/picker/time/DatePicker.kt')
          replace_once(
              date_picker,
              'import androidx.compose.ui.graphics.painter.Painter\n',
              'import androidx.compose.ui.graphics.painter.Painter\nimport androidx.compose.ui.platform.LocalLocale\n',
              'DatePicker LocalLocale import',
          )
          replace_once(
              date_picker,
              'import java.util.Locale\n',
              '',
              'DatePicker java Locale import',
          )
          replace_once(
              date_picker,
              '        val days = DateUtil.getDayOfWeekInOrder(Locale.getDefault())\n\n        days.forEach { day ->',
              '        val locale = LocalLocale.current.platformLocale\n        val days = DateUtil.getDayOfWeekInOrder(locale)\n\n        days.forEach { day ->',
              'DatePicker observable locale',
          )
          replace_once(
              date_picker,
              '                text = day.getDisplayName(TextStyle.SHORT, Locale.getDefault()),',
              '                text = day.getDisplayName(TextStyle.SHORT, locale),',
              'DatePicker display locale',
          )

          debug = Path('lib/src/main/java/org/oneui/compose/util/Debug.kt')
          replace_once(
              debug,
              '''fun Modifier.debugBorder() = this.then(\n    border(\n        width = 0.5.dp,\n        color = Color(\n            red = rand.nextFloat(),\n            green = rand.nextFloat(),\n            blue = rand.nextFloat()\n        )\n    )\n)''',
              '''fun Modifier.debugBorder() = border(\n    width = 0.5.dp,\n    color = Color(\n        red = rand.nextFloat(),\n        green = rand.nextFloat(),\n        blue = rand.nextFloat()\n    )\n)''',
              'debugBorder modifier chain',
          )

          overlay = Path('lib/src/main/java/org/oneui/compose/layout/internal/modifier/DrawInfront.kt')
          replace_once(
              overlay,
              '''): Modifier = this.then(\n    drawWithContent {\n        drawContent()\n        onDraw(this)\n    }\n)''',
              '''): Modifier = drawWithContent {\n    drawContent()\n    onDraw(this)\n}''',
              'overlay modifier chain',
          )

          build = Path('lib/build.gradle.kts')
          replace_once(
              build,
              '''    buildFeatures {\n        compose = true\n    }\n}''',
              '''    buildFeatures {\n        compose = true\n    }\n\n    lint {\n        baseline = file("lint-baseline.xml")\n    }\n}''',
              'lint baseline configuration',
          )
          PY
          git diff --check

      - name: Generate narrow translation baseline
        shell: bash
        run: |
          ./gradlew :lib:updateLintBaseline --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('lib/lint-baseline.xml')
          tree = ET.parse(path)
          root = tree.getroot()
          issues = list(root.findall('issue'))
          kept = [issue for issue in issues if issue.get('id') == 'MissingTranslation']
          if len(kept) != 175:
              raise SystemExit(f'expected 175 inherited MissingTranslation issues, found {len(kept)}')
          for issue in issues:
              if issue.get('id') != 'MissingTranslation':
                  root.remove(issue)
          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
          ./gradlew :lib:lintDebug :lib:testDebugUnitTest --stacktrace
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/build.gradle.kts \
            lib/lint-baseline.xml \
            lib/src/main/java/org/oneui/compose/picker/time/DatePicker.kt \
            lib/src/main/java/org/oneui/compose/util/Debug.kt \
            lib/src/main/java/org/oneui/compose/layout/internal/modifier/DrawInfront.kt
          git commit -m "fix: modernize compose lint compatibility"
          git push origin HEAD:feature/oneui8-compose-components
