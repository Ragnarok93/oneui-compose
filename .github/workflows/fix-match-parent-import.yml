name: Fix Compose BoxScope import

on:
  push:
    branches:
      - feature/oneui8-compose-components

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/oneui8-compose-components
      - name: Remove invalid top-level matchParentSize imports
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^import androidx\.compose\.foundation\.layout\.matchParentSize$/d' \
            lib/src/main/java/org/oneui/compose/components/buttons/OneUiButtons.kt \
            lib/src/main/java/org/oneui/compose/icons/OneUiAnimatedIcons.kt
          git diff --check
          git diff --exit-code --quiet && { echo 'No changes needed'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/main/java/org/oneui/compose/components/buttons/OneUiButtons.kt \
            lib/src/main/java/org/oneui/compose/icons/OneUiAnimatedIcons.kt
          git commit -m 'fix: remove invalid BoxScope modifier imports'
          git push origin HEAD:feature/oneui8-compose-components
