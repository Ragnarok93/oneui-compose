name: Task 2 reference drawable audit

on:
  push:
    branches: [feature/oneui8-compose-components]
    paths:
      - .github/workflows/task2-reference-drawable-audit.yml

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Derive pinned reference drawable resources
        shell: bash
        run: |
          set -euo pipefail
          REF_SHA=ce4f2cae8c0d712acd2f0b2926ee909fd5d8a434
          git clone --quiet --filter=blob:none https://github.com/Ragnarok93/oneui-design.git reference
          git -C reference checkout --quiet "$REF_SHA"
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          root = Path('reference/lib/src/main/res')
          names = set()
          source_rows = []
          for directory in sorted(root.glob('drawable*')):
              if not directory.is_dir():
                  continue
              for file in sorted(directory.iterdir()):
                  if not file.is_file():
                      continue
                  name = file.name
                  name = re.sub(r'\.9\.(png|webp)$', '', name)
                  name = re.sub(r'\.[^.]+$', '', name)
                  if re.fullmatch(r'[a-z0-9_]+', name):
                      names.add(name)
                      source_rows.append((name, file.as_posix()))

          # Drawable resources may also be declared from values XML.
          for values_dir in sorted(root.glob('values*')):
              if not values_dir.is_dir():
                  continue
              for file in sorted(values_dir.glob('*.xml')):
                  try:
                      tree = ET.parse(file)
                  except ET.ParseError:
                      continue
                  for element in tree.getroot().iter():
                      if element.tag == 'item' and element.attrib.get('type') == 'drawable':
                          name = element.attrib.get('name', '')
                      elif element.tag == 'drawable':
                          name = element.attrib.get('name', '')
                      else:
                          continue
                      if re.fullmatch(r'[a-z0-9_]+', name):
                          names.add(name)
                          source_rows.append((name, file.as_posix()))

          names = sorted(names)
          Path('audit/oneui-design-drawables.txt').write_text('\n'.join(names) + '\n')
          Path('audit/oneui-design-drawable-sources.tsv').write_text(
              '\n'.join(f'{name}\t{path}' for name, path in sorted(set(source_rows))) + '\n'
          )
          print(f'pinned oneui-design drawable resources: {len(names)}')
          PY
      - name: Inventory oneui-icons 1.1.0 and construct reference namespace
        shell: bash
        run: |
          set -euo pipefail
          AAR=audit/icons-1.1.0.aar
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/io/github/oneuiproject/icons/1.1.0/icons-1.1.0.aar \
            -o "$AAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, re

          aar = Path('audit/icons-1.1.0.aar')
          with zipfile.ZipFile(aar) as z:
              icon_names = set()
              for entry in z.namelist():
                  parts = entry.split('/')
                  if len(parts) >= 3 and parts[0] == 'res' and parts[1].startswith('drawable') and not entry.endswith('/'):
                      name = parts[-1]
                      name = re.sub(r'\.9\.(png|webp)$', '', name)
                      name = re.sub(r'\.[^.]+$', '', name)
                      if re.fullmatch(r'[a-z0-9_]+', name):
                          icon_names.add(name)

          icon_names = sorted(icon_names)
          design_names = {
              line for line in Path('audit/oneui-design-drawables.txt').read_text().splitlines() if line
          }
          namespace = sorted(set(icon_names) | design_names)
          Path('audit/oneui-icons-drawables.txt').write_text('\n'.join(icon_names) + '\n')
          Path('audit/reference-oneui-namespace-drawables.txt').write_text('\n'.join(namespace) + '\n')
          Path('audit/icons-only.txt').write_text('\n'.join(n for n in icon_names if n not in design_names) + '\n')
          Path('audit/design-only.txt').write_text('\n'.join(n for n in sorted(design_names) if n not in set(icon_names)) + '\n')
          print(f'oneui-icons drawable resources: {len(icon_names)}')
          print(f'combined One UI namespace drawable resources: {len(namespace)}')
          print(f'design-only drawable resources: {len(design_names - set(icon_names))}')
          print('--- design-only inventory ---')
          print('\n'.join(n for n in sorted(design_names) if n not in set(icon_names)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task2-reference-drawable-audit
          path: audit/
          if-no-files-found: error
