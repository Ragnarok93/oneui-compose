name: One UI 8 Compose demo APK

on:
  push:
    branches:
      - feature/oneui8-compose-components
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify parity manifests, library, and catalog
        id: verify
        continue-on-error: true
        env:
          GROUP: com.github.Ragnarok93.oneui-compose
          ARTIFACT: lib
          VERSION: ${{ github.sha }}
        run: |
          python3 scripts/audit-oneui8-parity.py --strict
          ./gradlew \
            :lib:testDebugUnitTest \
            :lib:compileDebugAndroidTestKotlin \
            :lib:lintDebug \
            :lib:assembleRelease \
            :lib:publishMavenPublicationToMavenLocal \
            :demo:testDebugUnitTest \
            :demo:compileDebugAndroidTestKotlin \
            :demo:assembleDebug \
            --stacktrace
          published="$HOME/.m2/repository/com/github/Ragnarok93/oneui-compose/lib/${VERSION}"
          test -s "$published/lib-${VERSION}.aar"
          test -s "$published/lib-${VERSION}.pom"
          grep -q '<dependency>' "$published/oneui-compose-${VERSION}.pom"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneui-compose-verification-reports
          path: |
            lib/build/reports/tests/
            lib/build/reports/lint-results-debug.*
            lib/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            demo/build/reports/tests/
            demo/build/reports/androidTests/
          if-no-files-found: warn

      - name: Upload demo APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneui-compose-oneui8-demo-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: warn

      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
