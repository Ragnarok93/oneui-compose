name: One UI 8 Compose demo APK

on:
  push:
    branches:
      - feature/oneui8-compose-components
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify library and build demo
        id: verify
        continue-on-error: true
        run: ./gradlew :lib:testDebugUnitTest :lib:lintDebug :lib:assembleRelease :demo:assembleDebug --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneui-compose-verification-reports
          path: |
            lib/build/reports/tests/
            lib/build/reports/lint-results-debug.*
            lib/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload demo APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneui-compose-oneui8-demo-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: warn

      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
