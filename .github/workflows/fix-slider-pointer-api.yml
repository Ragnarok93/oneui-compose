name: Fix slider pointer API

on:
  push:
    branches:
      - feature/oneui8-compose-components

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/oneui8-compose-components
      - name: Patch Compose gesture API usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('lib/src/main/java/org/oneui/compose/components/slider/OneUiSlider.kt'),
              Path('lib/src/main/java/org/oneui/compose/components/slider/OneUiRangeSlider.kt'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace(
                  'import androidx.compose.foundation.gestures.awaitEachGesture\n',
                  'import androidx.compose.foundation.gestures.awaitEachGesture\nimport androidx.compose.foundation.gestures.awaitFirstDown\n',
              )
              text = text.replace('import androidx.compose.ui.input.pointer.awaitFirstDown\n', '')
              text = text.replace('interactionSource.emit(', 'interactionSource.tryEmit(')
              path.write_text(text)
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'No changes needed'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/main/java/org/oneui/compose/components/slider/OneUiSlider.kt \
            lib/src/main/java/org/oneui/compose/components/slider/OneUiRangeSlider.kt
          git commit -m 'fix: use current Compose slider pointer APIs'
          git push origin HEAD:feature/oneui8-compose-components
