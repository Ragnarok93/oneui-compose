name: Fix inherited lint source defect

on:
  push:
    branches:
      - feature/oneui8-compose-components

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve dark theme resource color
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/main/java/org/oneui/compose/theme/color/DynamicDarkColorTheme.kt')
          text = path.read_text()
          old = 'Color(R.color.sesl_preference_relative_card_background_dark)'
          new = 'color(R.color.sesl_preference_relative_card_background_dark)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one resource-color bug, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/main/java/org/oneui/compose/theme/color/DynamicDarkColorTheme.kt
          git commit -m "fix: resolve dynamic dark theme resource color"
          git push origin HEAD:feature/oneui8-compose-components
