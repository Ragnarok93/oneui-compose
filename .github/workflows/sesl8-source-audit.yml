name: SESL8 source audit

on:
  push:
    branches:
      - feature/oneui8-compose-components

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      GH_USERNAME: ${{ github.repository_owner }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
    steps:
      - name: Checkout pinned oneui-design
        uses: actions/checkout@v5
        with:
          repository: Ragnarok93/oneui-design
          ref: c9225f3c07bac88f43f3bf2f100963133e27199a
          path: oneui-design
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Resolve exact SESL8 artifacts and inventory slider/progress surface
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_ACCESS_TOKEN:-}" || { echo 'GH_ACCESS_TOKEN is not available'; exit 1; }
          mkdir -p audit
          cd oneui-design
          ./gradlew :oneui-design:dependencies --configuration debugRuntimeClasspath > ../audit/dependencies.txt
          APP_ROOT="$HOME/.gradle/caches/modules-2/files-2.1/sesl.androidx.appcompat/appcompat/1.8.0+1.0.21-sesl8+rev2"
          MAT_ROOT="$HOME/.gradle/caches/modules-2/files-2.1/sesl.com.google.android.material/material/1.12.0+1.0.32-sesl8+rev3"
          {
            echo '=== Resolved SESL8 appcompat artifacts ==='
            find "$APP_ROOT" -type f -maxdepth 5 -print | sort
            echo '=== Resolved SESL8 material artifacts ==='
            find "$MAT_ROOT" -type f -maxdepth 5 -print | sort
          } > ../audit/artifacts.txt
          APP_AAR="$(find "$APP_ROOT" -type f -name '*.aar' | head -n1)"
          test -n "$APP_AAR"
          echo "appcompat_sha256=$(sha256sum "$APP_AAR" | awk '{print $1}')" > ../audit/checksums.txt
          unzip -l "$APP_AAR" | grep -Ei 'seekbar|progressbar|scrubber|slider' > ../audit/appcompat-slider-progress-files.txt || true
          TMP="$(mktemp -d)"
          unzip -q "$APP_AAR" -d "$TMP"
          if [[ -f "$TMP/classes.jar" ]]; then
            jar tf "$TMP/classes.jar" | grep -Ei 'Sesl(AbsSeekBar|SeekBar|ProgressBar)|SliderDrawable|ThumbDrawable' > ../audit/appcompat-slider-progress-classes.txt || true
          fi
          grep -E 'sesl\.androidx\.appcompat:appcompat|sesl\.com\.google\.android\.material:material' ../audit/dependencies.txt > ../audit/resolved-versions.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: sesl8-source-audit
          path: audit
          if-no-files-found: error
